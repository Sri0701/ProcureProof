services:
  - type: web
    name: procureproof-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w shared && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: DEMO_EMAIL
        value: demo@procureproof.app
      - key: DEMO_PASSWORD
        sync: false
